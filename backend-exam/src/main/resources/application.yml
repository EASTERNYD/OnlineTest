server:
  port: 8080

spring:
  application:
    name: exam-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/exam_system?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 通过环境变量 MYSQL_PASSWORD 注入真实密码（不要把真实密码提交到仓库）
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: utf-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # 通过环境变量 JWT_SECRET 注入；生产环境必须替换为足够长的随机密钥
  secret: ${JWT_SECRET:exam-system-jwt-secret-key-please-change-me-0123456789abcdef}
  # token 有效期（毫秒），默认 24 小时
  expiration: 86400000

file:
  # 上传目录（相对于后端运行目录，可用环境变量 FILE_UPLOAD_DIR 覆盖为绝对路径）
  upload-dir: ${FILE_UPLOAD_DIR:./upload}

# DeepSeek 大模型配置（AI 生成题目）
llm:
  base-url: https://api.deepseek.com
  # 通过环境变量 LLM_API_KEY 注入真实 Key（不要把真实 Key 提交到仓库）
  api-key: ${LLM_API_KEY:sk-xxxxxxxxxxxxxxxx}
  model: deepseek-chat

# Knife4j / springdoc 接口文档
knife4j:
  enable: true
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
