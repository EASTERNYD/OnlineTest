server:
  port: 8080

spring:
  application:
    name: exam-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/exam_system?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 首次启动前改成你的 MySQL 密码（改动勿提交到公开仓库）
    password: root
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: utf-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # 生产环境请替换为足够长的随机密钥（改动勿提交到公开仓库）
  secret: exam-system-jwt-secret-key-please-change-me-0123456789abcdef
  # token 有效期（毫秒），默认 24 小时
  expiration: 86400000

file:
  # 上传目录（相对于后端运行目录，可改为绝对路径）
  upload-dir: ./upload

# DeepSeek 大模型配置（AI 生成题目）
llm:
  base-url: https://api.deepseek.com
  # TODO: 填入你的 DeepSeek API Key（改动勿提交到公开仓库）
  api-key: sk-xxxxxxxxxxxxxxxx
  model: deepseek-chat
  # 连接超时（毫秒）
  connect-timeout: 10000
  # 读取超时（毫秒）——AI 生成耗时较长，默认 3 分钟
  read-timeout: 180000

# Knife4j / springdoc 接口文档
knife4j:
  enable: true
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
